[package]
name = "cm-framekit"
version = "2.0.0"
description = "CM FrameKit — 截帧 / 提取音频 / 雪碧图 / 预览视频，输出面向全浏览器兼容"
edition = "2021"
rust-version = "1.77"

[lib]
name = "framekit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "fs"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
