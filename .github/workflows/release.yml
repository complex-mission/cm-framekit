name: Release

# 推送 v* 标签时构建并发布；也可手动触发（只产出构建产物）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 精简 FFmpeg：MSYS2 MINGW64 编译，按构建脚本内容缓存 ----
      - name: Cache FFmpeg build
        id: ffcache
        uses: actions/cache@v4
        with:
          path: src-tauri/ffmpeg
          key: ffmpeg-win64-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/ffbuild/**') }}

      - name: Setup MSYS2
        if: steps.ffcache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make diffutils tar xz
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-curl

      - name: Build FFmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          JOBS=$(nproc) bash scripts/build-ffmpeg.sh
          ls -la src-tauri/ffmpeg

      - name: Smoke test FFmpeg
        shell: pwsh
        run: |
          foreach ($exe in 'ffmpeg', 'ffprobe') {
            $out = & "src-tauri/ffmpeg/$exe.exe" -hide_banner -version
            if ($LASTEXITCODE -ne 0) { throw "$exe 无法运行（退出码 $LASTEXITCODE）" }
            Write-Host $out[0]
          }
          # 关键组件必须在：缺任何一个都说明 configure 参数被改坏了
          $enc = & src-tauri/ffmpeg/ffmpeg.exe -hide_banner -encoders
          foreach ($e in 'libx264', 'libx265', 'aac', 'libmp3lame', 'libopus', 'libwebp_anim', 'h264_nvenc', 'h264_qsv', 'h264_amf') {
            if (-not ($enc -match " $e ")) { throw "缺少编码器 $e" }
          }
          $flt = & src-tauri/ffmpeg/ffmpeg.exe -hide_banner -filters
          foreach ($f in 'zscale', 'tonemap', 'yadif', 'palettegen', 'tile') {
            if (-not ($flt -match " $f ")) { throw "缺少滤镜 $f" }
          }

      # ---- Tauri ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CM-FrameKit-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
