# fk.complexmission.com → 127.0.0.1:8080
server {
    listen 80;
    server_name fk.complexmission.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fk.complexmission.com;

    ssl_certificate     /etc/nginx/ssl/fk.complexmission.com.pem;
    ssl_certificate_key /etc/nginx/ssl/fk.complexmission.com.key;

    # 后台上传安装包：放开体积（与 MAX_UPLOAD_MB 一致），不缓冲，超时放长
    client_max_body_size 1024m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # 必须覆盖而不是追加，否则客户端可伪造 X-Forwarded-For 绕过限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
